name: Bob Ding Cross-Platform Tests

on: 
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test-cross-platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display system info
      run: |
        python --version
        python -c "import sys; print(f'Platform: {sys.platform}')"
    
    - name: Run core smoke tests
      timeout-minutes: 2
      run: python test.py
    
    - name: Run feature tests
      timeout-minutes: 2
      run: python test_features.py
    
    - name: Run command tests
      timeout-minutes: 2
      run: python test_commands.py
    
    - name: Run game mode tests
      timeout-minutes: 2
      run: python test_game_modes.py
    
    - name: Run relationship tests
      timeout-minutes: 2
      run: python test_relationships.py
    
    - name: Run horror systems tests
      timeout-minutes: 2
      run: python test_horror_systems.py
    
    - name: Run ending tests
      timeout-minutes: 5
      run: python test_endings.py
    
    - name: Validate UTF-8 encoding support
      run: python -c "print('UTF-8 Test: ████ ░ ▒ ▓ █ ╳ ▫ ◙ ▪ Passed ✓')"
