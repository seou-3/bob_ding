name: Bob Ding Test Suite

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Bob Ding tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python --version

      - name: Run core smoke tests
        timeout-minutes: 2
        run: python3 test.py

      - name: Run comprehensive feature tests
        timeout-minutes: 2
        run: python3 test_features.py

      - name: Run command system tests
        timeout-minutes: 2
        run: python3 test_commands.py

      - name: Run game mode tests
        timeout-minutes: 2
        run: python3 test_game_modes.py

      - name: Run relationship system tests
        timeout-minutes: 2
        run: python3 test_relationships.py

      - name: Run horror mechanics tests
        timeout-minutes: 2
        run: python3 test_horror_systems.py

      - name: Run ending tests
        timeout-minutes: 5
        run: python3 test_endings.py

      - name: Display secrets catalog
        timeout-minutes: 2
        run: python3 test_secrets.py

      - name: Test main.py imports
        timeout-minutes: 1
        run: python3 -c "import main; print('✓ main.py imports successfully')"

  validate:
    name: Validate game integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Check file structure
        run: |
          echo "Checking required files..."
          test -f main.py && echo "✓ main.py exists" || (echo "✗ main.py missing" && exit 1)
          test -f README.md && echo "✓ README.md exists" || (echo "✗ README.md missing" && exit 1)
          test -f test.py && echo "✓ test.py exists" || (echo "✗ test.py missing" && exit 1)
          test -f test_features.py && echo "✓ test_features.py exists" || (echo "✗ test_features.py missing" && exit 1)
          test -f test_commands.py && echo "✓ test_commands.py exists" || (echo "✗ test_commands.py missing" && exit 1)
          test -f test_game_modes.py && echo "✓ test_game_modes.py exists" || (echo "✗ test_game_modes.py missing" && exit 1)
          test -f test_relationships.py && echo "✓ test_relationships.py exists" || (echo "✗ test_relationships.py missing" && exit 1)
          test -f test_horror_systems.py && echo "✓ test_horror_systems.py exists" || (echo "✗ test_horror_systems.py missing" && exit 1)
          test -f test_endings.py && echo "✓ test_endings.py exists" || (echo "✗ test_endings.py missing" && exit 1)
          test -f test_secrets.py && echo "✓ test_secrets.py exists" || (echo "✗ test_secrets.py missing" && exit 1)
          test -f run_all_tests.py && echo "✓ run_all_tests.py exists" || (echo "✗ run_all_tests.py missing" && exit 1)

      - name: Count secrets
        run: |
          SECRET_COUNT=$(python3 test_secrets.py | grep "TOTAL SECRETS:" | awk '{print $3}')
          echo "Found $SECRET_COUNT secrets"
          if [ "$SECRET_COUNT" -lt 150 ]; then
            echo "✗ Expected at least 150 secrets, found $SECRET_COUNT"
            exit 1
          fi
          echo "✓ Secret count validated ($SECRET_COUNT secrets)"
